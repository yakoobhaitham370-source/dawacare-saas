# Isolated local development only. Never link this project to production.
project_id = "dawacare-development"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[studio]
enabled = false
[inbucket]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "5MiB"
[auth]
enabled = true
site_url = "http://localhost:8888"
additional_redirect_urls = ["http://localhost:8888/accept-invitation", "http://localhost:8888/reset-password", "http://localhost:5173/accept-invitation", "http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600
[auth.mfa]
max_enrolled_factors = 3
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[analytics]
enabled = false
[edge_runtime]
enabled = false
